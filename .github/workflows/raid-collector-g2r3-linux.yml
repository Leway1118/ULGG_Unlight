name: Raid Collector G2-R3 Linux Offline Gate

on:
  pull_request:
    branches: [review/raid-protocol16-offline-p0]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/raid-collector-g2r3-linux.yml'
      - 'tool/raid-bot/**'

permissions:
  contents: read

concurrency:
  group: raid-collector-g2r3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression (237+ cases, no external sockets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge without saved credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/raid-bot/requirements-test.txt
      - name: Install isolated offline test requirements
        run: python -m pip install --disable-pip-version-check -r tool/raid-bot/requirements-test.txt
      - name: Run network-guarded Raid Bot regression
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python tool/raid-bot/run_offline_regression.py \
            --workers 2 \
            --timeout 45 \
            --report "${{ runner.temp }}/g2r3-offline.json"
      - name: Verify complete regression and undiscovered manual scripts
        run: |
          python - "${{ runner.temp }}/g2r3-offline.json" <<'PY'
          import json
          import pathlib
          import sys
          report=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          counts=report['counts']
          assert counts['FAIL'] == counts['TIMEOUT'] == 0, counts
          assert report['passed_cases'] >= 237, report['passed_cases']
          assert counts['MANUAL_NOT_DISCOVERED'] == 3, counts
          print('G2R3_OFFLINE_PASS',report['passed_cases'],counts)
          PY

  linux-permission-gate:
    name: Linux non-root accounts, audit and Unix socket (synthetic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge without saved credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/raid-bot/requirements-test.txt
      - name: Install isolated offline test requirements
        run: python -m pip install --disable-pip-version-check -r tool/raid-bot/requirements-test.txt
      - name: Stage only synthetic Gatekeeper sources in /tmp for isolated UIDs
        run: |
          set -euo pipefail
          stage="$(mktemp -d /tmp/ulgg-g2r3-ci-XXXXXX)"
          mkdir -p "$stage/raid_bot/safety" "$stage/tests"
          cp tool/raid-bot/raid_bot/safety/*.py "$stage/raid_bot/safety/"
          cp tool/raid-bot/run_gatekeeper_fixture.py "$stage/"
          cp tool/raid-bot/run_gatekeeper_worker_fixture.py "$stage/"
          cp tool/raid-bot/tests/linux_gatekeeper_owner_tests.py "$stage/tests/"
          cp tool/raid-bot/tests/linux_gatekeeper_ci_smoke.py "$stage/tests/"
          chmod -R a+rX "$stage"
          echo "G2R3_STAGE=$stage" >> "$GITHUB_ENV"
      - name: Run Linux manager ledger tests as synthetic non-root UID
        run: |
          set -euo pipefail
          cd "$G2R3_STAGE"
          sudo env -i PATH="$PATH" PYTHONPATH="$PWD" PYTHONDONTWRITEBYTECODE=1 PYTHON_DOTENV_DISABLED=1 \
            /usr/bin/setpriv --reuid=12001 --regid=12001 --clear-groups \
            "$(command -v python)" -m unittest discover -s tests \
            -p 'linux_gatekeeper_owner_tests.py' -v
      - name: Run isolated manager/worker UID split and Unix socket smoke
        run: |
          set -euo pipefail
          cd "$G2R3_STAGE"
          sudo env -i PATH="$PATH" PYTHONPATH="$PWD" PYTHONDONTWRITEBYTECODE=1 PYTHON_DOTENV_DISABLED=1 \
            "$(command -v python)" tests/linux_gatekeeper_ci_smoke.py
      - name: Verify Linux systemd syntax only (never start services)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp tool/raid-bot/docs/collector-g2r3-gatekeeper.service.example "$tmp/collector-g2r3-gatekeeper.service"
          cp tool/raid-bot/docs/collector-g2r3-fixture-worker.service.example "$tmp/collector-g2r3-fixture-worker.service"
          systemd-analyze verify "$tmp/collector-g2r3-gatekeeper.service" "$tmp/collector-g2r3-fixture-worker.service"
          systemd-analyze security --offline=yes "$tmp/collector-g2r3-gatekeeper.service" > "$tmp/manager-security.txt"
          systemd-analyze security --offline=yes "$tmp/collector-g2r3-fixture-worker.service" > "$tmp/worker-security.txt"
          echo G2R3_SYSTEMD_STATIC_PASS
