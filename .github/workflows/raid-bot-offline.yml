name: Raid Bot Offline Regression

on:
  pull_request:
    branches: [server-sync]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/raid-bot-offline.yml'
      - 'tool/raid-bot/**'
      - 'tool/core/runtime/cdp/ul_sniffer.py'

permissions:
  contents: read

concurrency:
  group: raid-bot-offline-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-unittest:
    name: Protocol 1.6 and Raid Bot offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR merge without persistent credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/raid-bot/requirements-test.txt

      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check -r tool/raid-bot/requirements-test.txt

      - name: Run regression with blocked non-loopback sockets
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python tool/raid-bot/run_offline_regression.py \
            --workers 2 \
            --timeout 30 \
            --report "${{ runner.temp }}/raid-bot-offline.json"

      - name: Check minimum test coverage
        run: |
          python - "${{ runner.temp }}/raid-bot-offline.json" <<'PY'
          import json
          import pathlib
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          counts = report['counts']
          cases = report['passed_cases']
          assert counts['FAIL'] == 0 and counts['TIMEOUT'] == 0, counts
          assert cases >= 170, f'Expected at least 170 unittest cases, got {cases}'
          assert counts['MANUAL_NOT_DISCOVERED'] == 3, counts
          print(f'RAID_OFFLINE_CI_PASS: {cases} cases, {counts}')
          PY
