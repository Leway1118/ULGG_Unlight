name: Checkpoint 2026 FT03BR2 profile access
on:
  pull_request:
    branches: [review/checkpoint2026-ft03cd-preview-v03]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  access:
    if: github.event.pull_request.draft == true && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/checkpoint2026-ft03br2-profile-access'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact base and scoped changes
        run: |
          set -euo pipefail
          base=0c3689fce88cc17fc4a803b2e04bc8f0a129d894
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base" HEAD | wc -l)" -eq 8
          git diff --name-only "$base" HEAD | while read -r path; do
            case "$path" in pages/profile.php|pages/admin/checkpoint2026_preview.php|lib/checkpoint2026/PreviewAccess.php|tests/checkpoint2026/ft03a/guard_test.php|tests/checkpoint2026/ft03br2/http.php|tests/checkpoint2026/ft03br2/browser.py|docs/checkpoint2026/FT03BR2_PROFILE_ACCESS.md|.github/workflows/checkpoint2026-ft03br2-profile.yml) ;; *) exit 3;; esac
          done
          echo "7fd90bb12814ca6d8e56d545bdd6005fc6b9d30c6dfe902787bcb6fb59b02bd1  tests/checkpoint2026/ft03cd/preview.html" | sha256sum -c -
      - name: Isolated PHP synthetic HTTP and rollback
        env:
          PHP_IMAGE: php:${{ matrix.php }}-cli
        run: |
          set -euo pipefail
          docker pull "$PHP_IMAGE"
          out="$RUNNER_TEMP/ft03br2"
          mkdir -p "$out"
          docker image inspect --format '{{json .RepoDigests}}' "$PHP_IMAGE" | tee "$out/image-digest.json"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --tmpfs "/tmp:rw,nosuid,nodev,mode=1777" \
            --tmpfs "/var/lib/ulgg/checkpoint2026-preview:rw,nosuid,nodev,mode=1777" \
            -e ULGG_FT03BR2_MODE=SYNTHETIC_OFFLINE_ONLY \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$out:/out:rw" "$PHP_IMAGE" \
            sh -ec 'php -l /repo/pages/profile.php; php -l /repo/pages/admin/checkpoint2026_preview.php; php -l /repo/lib/checkpoint2026/PreviewAccess.php; php /repo/tests/checkpoint2026/ft03a/guard_test.php; php /repo/tests/checkpoint2026/ft03br2/http.php' | tee "$out/php.log"
      - name: Chromium responsive fixture and V0.3 regression
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages playwright==1.56.0
          python3 tests/checkpoint2026/ft03br2/browser.py "$RUNNER_TEMP/ft03br2"
          python3 tests/checkpoint2026/ft03cd/browser.py "$RUNNER_TEMP/ft03br2/authorized.html" "$RUNNER_TEMP/ft03br2/v03"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: checkpoint26-ft03br2-php-${{ matrix.php }}
          path: ${{ runner.temp }}/ft03br2/
          retention-days: 14
