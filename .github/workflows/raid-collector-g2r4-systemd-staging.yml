name: Raid Collector G2-R4 Ephemeral systemd Staging

on:
  pull_request:
    branches: [review/raid-collector-g2r3-offline]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/raid-collector-g2r4-systemd-staging.yml'
      - 'tool/raid-bot/**'

permissions:
  contents: read

concurrency:
  group: raid-g2r4-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-regression:
    name: Offline regression 244+ cases, no game network
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/raid-collector-g2r4-systemd-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout disposable PR staging sources
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: tool/raid-bot/requirements-test.txt
      - name: Install offline test dependencies
        run: python -m pip install --disable-pip-version-check -r tool/raid-bot/requirements-test.txt
      - name: Offline regression (no external sockets)
        env:
          PYTHON_DOTENV_DISABLED: '1'
        run: |
          python tool/raid-bot/run_offline_regression.py \
            --workers 2 --timeout 45 --report "${{ runner.temp }}/g2r4-offline.json"
          python - "${{ runner.temp }}/g2r4-offline.json" <<'PY'
          import json, pathlib, sys
          r=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          c=r['counts']
          assert c['FAIL']==c['TIMEOUT']==0, c
          assert r['passed_cases']>=244, r['passed_cases']
          assert c['MANUAL_NOT_DISCOVERED']==3, c
          print('G2R4_OFFLINE_REGRESSION_PASS',r['passed_cases'],c)
          PY

  actual-systemd-staging:
    name: Actual systemd PID1 PrivateNetwork nonroot fixture + rollback
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'review/raid-collector-g2r4-systemd-stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUNNER_ENVIRONMENT: ${{ runner.environment }}
    steps:
      - name: Checkout (never save credentials)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify ephemeral GitHub-hosted systemd PID1
        run: |
          set -euo pipefail
          echo "G2R4_RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset}"
          echo "G2R4_GITHUB_ACTIONS=${GITHUB_ACTIONS:-unset}"
          echo "G2R4_PID1_COMM=$(cat /proc/1/comm)"
          echo "G2R4_SYSTEMD_STATE=$(systemctl is-system-running 2>&1 || true)"
          test "${RUNNER_ENVIRONMENT:-}" = 'github-hosted'
          test "${GITHUB_ACTIONS:-}" = 'true'
          test "$(cat /proc/1/comm)" = 'systemd'
          systemctl is-system-running --quiet || \
            systemctl is-system-running | grep -Eq 'running|degraded'
          echo G2R4_GITHUB_HOSTED_SYSTEMD_PID1_VERIFIED
      - name: Run synthetic actual systemd services; always rollback in finally
        env:
          G2R4_EPHEMERAL_STAGING: synthetic-only
        run: |
          set -euo pipefail
          sudo env -i \
            PATH="$PATH" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            G2R4_EPHEMERAL_STAGING=synthetic-only \
            /usr/bin/python3 tool/raid-bot/tests/linux_systemd_g2r4_staging.py \
              --report "${{ runner.temp }}/g2r4-systemd-evidence.json"
          python - "${{ runner.temp }}/g2r4-systemd-evidence.json" <<'PY'
          import json,pathlib,sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert d['status']=='PASS', d['errors']
          assert d['rollback']=='PASS',d['rollback']
          assert d['actual_systemd_net_probe']['inet_socket_denied']==[True,True]
          print('G2R4_PID1_PRIVATE_NETWORK_ROLLBACK_SUCCESS')
          print('G2R4_VERIFIED_STEPS',len(d['steps']))
          PY
      - name: Upload synthetic staging evidence only (never credentials)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ulgg-g2r4-systemd-synthetic-evidence
          path: ${{ runner.temp }}/g2r4-systemd-evidence.json
          if-no-files-found: warn
          retention-days: 14
